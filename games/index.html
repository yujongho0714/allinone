<title>정도 게임 오락실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>:root{--yjh5c2e81-a7f3:0}
:root{--bg:#0c1428;--card:#16213d;--line:#24315a;--gold:#f5c518;--sub:#9ca3af}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:#fff;font-family:'Noto Sans KR',system-ui,sans-serif;min-height:100%}
button{font:inherit;cursor:pointer}
.j{font-family:'Jua',sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 18px 30px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.logo{width:52px;height:52px;border-radius:16px;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:23px;flex:none}
.top h1{margin:0;font-family:'Jua';font-weight:400;font-size:32px}.top small{display:block;color:var(--sub);font-size:13px}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.tab{border:0;border-radius:16px;padding:10px 22px;font-family:'Jua';font-size:21px;background:var(--card);color:#c9d3ee;box-shadow:0 5px 0 #0a1020}
.tab.on{background:var(--gold);color:var(--bg);box-shadow:0 5px 0 #b8900a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.gc{border:3px solid var(--c);border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 8px 0 var(--c2);display:flex;flex-direction:column;text-align:left;color:#fff;padding:0;transition:transform .1s}
.gc:active{transform:translateY(4px);box-shadow:0 4px 0 var(--c2)}
.gc .art{height:150px;background:var(--c);display:flex;align-items:center;justify-content:center;position:relative}
.gc .tag{position:absolute;left:12px;top:12px;font-size:12px;font-weight:900;background:rgba(0,0,0,.28);border-radius:99px;padding:3px 10px}
.gc .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.gc .nm{font-family:'Jua';font-size:24px}.gc .ds{font-size:13.5px;color:#c9d3ee;line-height:1.45;flex:1}
.gc .best{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub)}.gc .best b{font-family:'Jua';font-weight:400;color:var(--gold);font-size:18px}
/* 게임 화면 */
#play{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,#1f3b78,#0c1428 70%);display:none;flex-direction:column;z-index:10}
#play.on{display:flex}
.ph{display:flex;align-items:center;gap:12px;padding:max(14px,env(safe-area-inset-top)) 18px 10px}
.x{border:0;width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.ph .t{font-family:'Jua';font-size:26px;flex:1}
.hud{display:flex;gap:10px}.hud span{background:rgba(0,0,0,.3);border-radius:12px;padding:6px 12px;font-family:'Jua';font-size:19px}
.bar{height:10px;background:rgba(255,255,255,.12);margin:0 18px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;gap:22px;text-align:center}
.q{font-family:'Jua';font-size:clamp(28px,4.5vw,46px);line-height:1.3;max-width:900px;text-shadow:0 3px 0 rgba(0,0,0,.3)}
.qsub{color:#c9d3ee;font-size:17px;margin-top:-10px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;width:min(900px,100%)}
.op{border:0;border-radius:20px;padding:20px 14px;font-family:'Jua';font-size:clamp(22px,3vw,30px);background:#fff;color:#0c1428;box-shadow:0 7px 0 #b9c2d6;min-height:84px;display:flex;align-items:center;justify-content:center;gap:10px}
.op:active{transform:translateY(4px);box-shadow:0 3px 0 #b9c2d6}
.op.ok{background:#22c55e;color:#fff;box-shadow:0 7px 0 #15803d}.op.no{background:#ef4444;color:#fff;box-shadow:0 7px 0 #b91c1c}
.belt{display:inline-block;width:110px;height:26px;border-radius:7px;border:2px solid rgba(0,0,0,.25)}
.seq{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.seq .belt{width:90px;height:22px}.seq .qm{width:90px;height:22px;border-radius:7px;border:3px dashed #fff;display:inline-flex;align-items:center;justify-content:center;font-family:'Jua'}
.dots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:520px}.dots i{width:44px;height:44px;border-radius:50%;background:var(--gold);box-shadow:0 4px 0 #b8900a}
.fb{font-family:'Jua';font-size:30px;min-height:40px}
.end .big{font-family:'Jua';font-size:72px;color:var(--gold);line-height:1}
.go{border:0;border-radius:20px;padding:16px 40px;font-family:'Jua';font-size:28px;background:var(--gold);color:var(--bg);box-shadow:0 7px 0 #b8900a}
.go.sec{background:#fff;box-shadow:0 7px 0 #b9c2d6}
/* 타이밍 게임 */
.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;width:min(560px,92vw)}
.pad{aspect-ratio:1;border:0;border-radius:28px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 4px rgba(255,255,255,.15);font-family:'Jua';font-size:28px;color:#fff;transition:background .08s}
.pad.lit{background:#f97316;box-shadow:0 0 40px #f97316,inset 0 0 0 4px #fff}
.pad.hit{background:#22c55e}
.foot{color:#6b7591;font-size:12px;text-align:center;margin-top:20px}
</style>

<body>
<div class="wrap">
  <div class="top"><div class="logo">正</div><div><h1>정도 게임 오락실</h1><small>나이 탭을 고르고 카드를 눌러 시작해요 · 임시 화면 (디자인은 나중에 바뀌어요)</small></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="foot">기록은 이 기기에만 저장돼요</div>
</div>
<div id="play"><div class="ph"><button class="x" id="px" aria-label="나가기">✕</button><div class="t" id="pt"></div><div class="hud" id="hud"></div></div><div class="bar"><i id="pbar" style="width:0"></i></div><div class="stage" id="stage"></div></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const best = { get: k => { try { return +localStorage.getItem('jdg_best_' + k) || 0; } catch(e){ return 0; } }, set: (k, v) => { try { if (v > best.get(k)) localStorage.setItem('jdg_best_' + k, v); } catch(e){} } };
function say(t){ try { const u = new SpeechSynthesisUtterance(t); u.lang = 'ko-KR'; u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch(e){} }

/* ── 문제 자료 ── */
const BELTS = [['흰띠', '#f2f2f2'], ['흰노띠', 'linear-gradient(90deg,#f2f2f2 50%,#ffd400 50%)'], ['노랑띠', '#ffd400'], ['노초띠', 'linear-gradient(90deg,#ffd400 50%,#2e9e44 50%)'], ['초록띠', '#2e9e44'], ['초파띠', 'linear-gradient(90deg,#2e9e44 50%,#1f5fd1 50%)'], ['파랑띠', '#1f5fd1'], ['보라띠', '#7b3fbf'], ['밤띠', '#6b3e1f'], ['밤빨띠', 'linear-gradient(90deg,#6b3e1f 50%,#d32f2f 50%)'], ['빨강띠', '#d32f2f'], ['빨검띠', 'linear-gradient(90deg,#d32f2f 50%,#111 50%)']];
const NUMS = ['하나', '둘', '셋', '넷', '다섯', '여섯', '일곱', '여덟', '아홉', '열'];
const OX = [['도장에 들어올 때는 신발을 가지런히 정리해요', 'O'], ['사범님께 인사할 때는 허리를 숙여 바르게 해요', 'O'], ['수업 중에 친구를 밀거나 장난쳐도 괜찮아요', 'X'], ['도복은 바닥에 던져 두어도 돼요', 'X'], ['겨루기가 끝나면 상대에게 인사해요', 'O'], ['다른 친구가 발차기할 때 가까이 다가가요', 'X'], ['물을 마시고 싶으면 사범님께 먼저 말해요', 'O'], ['띠는 아무 데나 두어도 괜찮아요', 'X'], ['집에 갈 때 부모님과 사범님께 인사해요', 'O'], ['줄을 설 때 친구를 새치기해요', 'X']];
const WORDS = [['차렷', '바르게 서서 움직이지 않는 자세'], ['경례', '바른 자세로 인사하기'], ['준비', '동작을 시작하기 전 기다리는 자세'], ['시작', '동작을 시작하라는 구령'], ['그만', '하던 동작을 멈추기'], ['바로', '처음 자세로 돌아오기'], ['기합', '힘을 모아 크게 외치는 소리'], ['도복', '태권도 할 때 입는 옷'], ['도장', '태권도를 배우는 곳'], ['품새', '정해진 순서대로 하는 기본 동작 모음'], ['겨루기', '두 사람이 정해진 규칙으로 기술을 겨루는 것'], ['격파', '송판이나 기왓장을 깨는 기술']];
const KICKS = [['앞차기', '앞으로 무릎을 올렸다가 앞을 향해 곧게 차요'], ['옆차기', '몸을 옆으로 돌리고 발날로 옆을 곧게 차요'], ['돌려차기', '무릎을 접어 옆으로 돌리며 발등으로 차요'], ['뒤차기', '등을 보이며 몸을 돌려 뒤쪽으로 곧게 차요'], ['내려차기', '다리를 위로 높이 올렸다가 아래로 내리며 차요'], ['반달차기', '앞차기와 돌려차기 사이, 비스듬히 반달 모양으로 차요']];
const TAEGUK = [['태극 1장', '건 (하늘)'], ['태극 2장', '태 (연못)'], ['태극 3장', '리 (불)'], ['태극 4장', '진 (우레)'], ['태극 5장', '손 (바람)'], ['태극 6장', '감 (물)'], ['태극 7장', '간 (산)'], ['태극 8장', '곤 (땅)']];
const SCORE = [['몸통 주먹 지르기', '1점'], ['몸통 발차기', '2점'], ['머리 발차기', '3점'], ['몸통 회전 발차기', '4점'], ['머리 회전 발차기', '5점']];

/* ── 게임 목록 ── */
const AGES = [['k', '유치부'], ['l', '1~3학년'], ['h', '4~6학년·중등'], ['all', '전체']];
const GAMES = [
  { id: 'belt', age: 'k', name: '띠 색깔 맞추기', desc: '띠 순서에서 빠진 띠를 찾아요', c: '#16a34a', c2: '#0f6b31', icon: 'M3 10h18v4H3z M10 8h4v8h-4z M11 16l-2 5 M13 16l2 5', make: () => pick([...Array(BELTS.length - 2).keys()], 10).map(s => { const seq = BELTS.slice(s, s + 3), hole = 1 + Math.floor(Math.random() * 2), ans = seq[hole];
      return { html: `<div class="seq">${seq.map((b, i) => i === hole ? '<span class="qm">?</span>' : `<span class="belt" style="background:${b[1]}"></span>`).join('<span class="j">→</span>')}</div>`, q: '빈칸에 들어갈 띠는?', answer: ans[0], options: shuffle([ans, ...pick(BELTS.filter(b => b !== ans), 2)]).map(b => ({ key: b[0], html: `<span class="belt" style="background:${b[1]};width:60px;height:18px"></span>${b[0]}` })) }; }) },
  { id: 'count', age: 'k', name: '구령 숫자 세기', desc: '하나·둘·셋! 공 개수에 맞는 구령을 골라요 (소리도 나와요)', c: '#2563eb', c2: '#163d8f', icon: 'M7 8h2v8 M13 8h4l-4 8h4', make: () => pick([...Array(10).keys()], 10).map(n => ({ q: '몇 개일까요? 구령으로!', html: `<div class="dots">${'<i></i>'.repeat(n + 1)}</div>`, answer: NUMS[n], speak: NUMS[n], options: shuffle([NUMS[n], ...pick(NUMS.filter((_, i) => i !== n), 3)]).map(k => ({ key: k, html: k })) })) },
  { id: 'ox', age: 'k', name: '예절 OX', desc: '도장에서 지킬 약속, 맞으면 O 틀리면 X', c: '#db2777', c2: '#8f1a4e', icon: 'M7 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z M14 8l6 8 M20 8l-6 8', make: () => pick(OX, 8).map(([q, a]) => ({ q, answer: a, options: [{ key: 'O', html: '⭕ O' }, { key: 'X', html: '❌ X' }] })) },
  { id: 'word', age: 'l', name: '태권도 말 퀴즈', desc: '차렷·경례·기합… 무슨 뜻일까요?', c: '#7c3aed', c2: '#4c1d95', icon: 'M9 9a3 3 0 1 1 4 2.8c-.6.3-1 .9-1 1.6V15 M12 18.5v.5', make: () => pick(WORDS, 10).map(([w, m]) => Math.random() < .5
      ? { q: `「${w}」의 뜻은?`, answer: m, options: shuffle([m, ...pick(WORDS.filter(x => x[0] !== w), 3).map(x => x[1])]).map(k => ({ key: k, html: `<span style="font-size:.75em">${esc(k)}</span>` })) }
      : { q: esc(m), qsub: '이 뜻을 가진 말은?', answer: w, options: shuffle([w, ...pick(WORDS.filter(x => x[0] !== w), 3).map(x => x[0])]).map(k => ({ key: k, html: k })) }) },
  { id: 'kick', age: 'l', name: '발차기 이름 맞히기', desc: '설명을 듣고 어떤 발차기인지 골라요', c: '#dc2626', c2: '#8f1a1a', icon: 'M6 18l5-6 3 2 4-8 M15 6h3v3', make: () => pick(KICKS, 6).map(([k, d]) => ({ q: esc(d), qsub: '어떤 발차기일까요?', answer: k, options: shuffle([k, ...pick(KICKS.filter(x => x[0] !== k), 3).map(x => x[0])]).map(x => ({ key: x, html: x })) })) },
  { id: 'reflex', age: 'l', name: '발차기 타이밍', desc: '빛나는 표적을 빨리 눌러요! 30초 동안 몇 번?', c: '#ea580c', c2: '#9a3a08', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8z', special: 'reflex' },
  { id: 'taeguk', age: 'h', name: '태극 품새 뜻 맞히기', desc: '태극 1~8장이 뜻하는 것(괘)을 맞혀요', c: '#0d9488', c2: '#0b5f57', icon: 'M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18z M12 3a4.5 4.5 0 0 1 0 9 4.5 4.5 0 0 0 0 9', make: () => pick(TAEGUK, 8).map(([p, m]) => Math.random() < .5
      ? { q: `${p}의 뜻은?`, answer: m, options: shuffle([m, ...pick(TAEGUK.filter(x => x[0] !== p), 3).map(x => x[1])]).map(k => ({ key: k, html: k })) }
      : { q: `「${m}」을 뜻하는 품새는?`, answer: p, options: shuffle([p, ...pick(TAEGUK.filter(x => x[0] !== p), 3).map(x => x[0])]).map(k => ({ key: k, html: k })) }) },
  { id: 'score', age: 'h', name: '겨루기 점수 퀴즈', desc: '이 기술로 맞히면 몇 점일까요? (전자호구 기준)', c: '#1d4ed8', c2: '#1e3a8a', icon: 'M4 6h16v12H4z M8 10h2 M8 14h8 M14 10h2', make: () => pick(SCORE, 5).concat(pick(SCORE, 5)).map(([t, s]) => ({ q: esc(t), qsub: '정확히 맞히면 몇 점?', answer: s, options: ['1점', '2점', '3점', '4점', '5점'].map(k => ({ key: k, html: k })) })) },
  { id: 'word2', age: 'h', name: '태권도 말 빨리 풀기', desc: '용어 퀴즈 어려운 버전 · 15문제', c: '#9333ea', c2: '#581c87', icon: 'M13 2L4 14h7l-1 8 9-12h-7z', make: () => pick(WORDS, 12).concat(pick(KICKS, 3)).map(([w, m]) => { const pool = WORDS.concat(KICKS); return { q: esc(m), qsub: '무엇일까요?', answer: w, options: shuffle([w, ...pick(pool.filter(x => x[0] !== w), 3).map(x => x[0])]).map(k => ({ key: k, html: k })) }; }) },
  { id: 'wordchain', age: 'all', name: '끝말잇기', desc: 'RPG 끝말잇기 (원래 게임 그대로 열려요)', c: '#4f46e5', c2: '#312e81', icon: 'M4 6h7v5H4z M13 13h7v5h-7z M11 8h4v5', link: 'https://yujongho0714.github.io/index3/' },
  { id: 'tile', age: 'all', name: '태권도 타일 마스터', desc: '타일 게임 (원래 게임 그대로 열려요)', c: '#059669', c2: '#065f46', icon: 'M5 5h6v6H5z M13 5h6v6h-6z M5 13h6v6H5z M16 13v6 M13 16h6', link: 'https://yujongho0714.github.io/tile/' },
];
let AGE = (() => { try { return localStorage.getItem('jdg_age') || 'k'; } catch(e){ return 'k'; } })();
function home(){
  $('#tabs').innerHTML = AGES.map(([k, t]) => `<button class="tab ${AGE === k ? 'on' : ''}" data-a="${k}">${t}</button>`).join('');
  const list = GAMES.filter(g => AGE === 'all' || g.age === AGE || g.age === 'all');
  $('#grid').innerHTML = list.map(g => `<button class="gc" data-g="${g.id}" style="--c:${g.c};--c2:${g.c2}"><div class="art"><span class="tag">${g.age === 'all' ? '누구나' : AGES.find(a => a[0] === g.age)[1]}</span><svg width="90" height="90" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${g.icon}"/></svg></div>
    <div class="bd"><div class="nm">${g.name}</div><div class="ds">${g.desc}</div>${g.link ? '' : `<div class="best"><span>내 최고 기록</span><b>${best.get(g.id) || '-'}</b></div>`}</div></button>`).join('');
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => { AGE = b.dataset.a; try { localStorage.setItem('jdg_age', AGE); } catch(e){} home(); });
  document.querySelectorAll('[data-g]').forEach(b => b.onclick = () => start(GAMES.find(g => g.id === b.dataset.g)));
}
/* ── 퀴즈 진행 ── */
let G = null;
function start(g){
  if (g.link){ location.href = g.link; return; }
  G = { g, i: 0, score: 0, combo: 0, qs: g.special ? [] : g.make(), lock: false };
  $('#pt').textContent = g.name; $('#play').classList.add('on');
  if (g.special === 'reflex') return reflex();
  ask();
}
function hud(){ $('#hud').innerHTML = `<span>⭐ ${G.score}</span>${G.combo > 1 ? `<span>🔥 ${G.combo}연속</span>` : ''}`; $('#pbar').style.width = `${G.qs.length ? G.i / G.qs.length * 100 : 0}%`; }
function ask(){
  const Q = G.qs[G.i]; G.lock = false; hud();
  $('#stage').innerHTML = `<div class="q">${Q.q}</div>${Q.qsub ? `<div class="qsub">${Q.qsub}</div>` : ''}${Q.html || ''}<div class="opts">${Q.options.map(o => `<button class="op" data-k="${esc(o.key)}">${o.html}</button>`).join('')}</div><div class="fb" id="fb"></div>`;
  if (Q.speak) setTimeout(() => say(Q.speak + '!'), 300);
  document.querySelectorAll('.op').forEach(b => b.onclick = () => answer(b));
}
function answer(b){
  if (G.lock) return; G.lock = true;
  const Q = G.qs[G.i], ok = b.dataset.k === Q.answer;
  b.classList.add(ok ? 'ok' : 'no');
  if (!ok) document.querySelectorAll('.op').forEach(x => { if (x.dataset.k === Q.answer) x.classList.add('ok'); });
  if (ok){ G.combo++; G.score += 10 + Math.min(G.combo - 1, 5) * 2; $('#fb').textContent = ['딩동댕! 👍', '정답! 최고예요 ✨', '맞았어요! 💪'][G.combo % 3]; if (Q.speak) say(Q.speak); }
  else { G.combo = 0; $('#fb').textContent = `아쉬워요! 정답은 「${Q.answer}」`; }
  hud(); setTimeout(() => { G.i++; G.i < G.qs.length ? ask() : end(); }, ok ? 900 : 1700);
}
function end(){
  const g = G.g, prev = best.get(g.id); best.set(g.id, G.score); $('#pbar').style.width = '100%';
  const stars = G.score >= G.qs.length * 14 ? 3 : G.score >= G.qs.length * 9 ? 2 : G.score > 0 ? 1 : 0;
  $('#stage').innerHTML = `<div class="end"><div class="j" style="font-size:30px">끝! 수고했어요</div><div class="big">${G.score}점</div><div style="font-size:54px;margin:8px 0">${'⭐'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>
    <div style="color:#c9d3ee;margin-bottom:18px">${G.score > prev ? '🎉 내 최고 기록이에요!' : `내 최고 기록 ${Math.max(prev, G.score)}점`}</div>
    <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap"><button class="go" id="again">한 번 더</button><button class="go sec" id="back">다른 게임</button></div></div>`;
  $('#again').onclick = () => start(g); $('#back').onclick = close;
}
function close(){ if (G && G.timer) clearInterval(G.timer); if (G && G.lit) clearTimeout(G.lit); G = null; $('#play').classList.remove('on'); home(); }
$('#px').onclick = close;
/* ── 발차기 타이밍 (30초 반응 게임) ── */
function reflex(){
  let left = 30, cur = -1;
  G.qs = []; $('#hud').innerHTML = '';
  $('#stage').innerHTML = `<div class="q">빛나는 표적을 빨리 눌러요!</div><div class="pads">${Array.from({ length: 9 }, (_, i) => `<button class="pad" data-p="${i}"></button>`).join('')}</div><div class="fb" id="fb">준비…</div>`;
  const pads = [...document.querySelectorAll('.pad')];
  const light = () => { pads.forEach(p => p.classList.remove('lit', 'hit')); let n; do { n = Math.floor(Math.random() * 9); } while (n === cur); cur = n; pads[n].classList.add('lit'); G.lit = setTimeout(() => { if (G){ G.combo = 0; light(); } }, Math.max(450, 1100 - G.score * 3)); };
  pads.forEach(p => p.onclick = () => { if (!G || left <= 0) return; if (+p.dataset.p === cur){ clearTimeout(G.lit); G.combo++; G.score += 10 + Math.min(G.combo, 10); p.classList.remove('lit'); p.classList.add('hit'); p.textContent = '팡!'; setTimeout(() => { p.textContent = ''; }, 200); $('#fb').textContent = `⭐ ${G.score} · 🔥 ${G.combo}`; light(); } else { G.combo = 0; } });
  setTimeout(() => { if (!G) return; $('#fb').textContent = '시작!'; light();
    G.timer = setInterval(() => { left--; $('#pbar').style.width = `${(30 - left) / 30 * 100}%`; $('#hud').innerHTML = `<span>⏱ ${left}</span><span>⭐ ${G.score}</span>`; if (left <= 0){ clearInterval(G.timer); clearTimeout(G.lit); G.qs = [1]; end(); } }, 1000); }, 1200);
}
home();
</script>
