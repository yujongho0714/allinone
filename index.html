<title>정도 올인원</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1428;--card:#16213d;--line:#24315a;--ink:#f3f4f6;--sub:#9ca3af;--gold:#f5c518}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 85% -10%,rgba(245,197,24,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(37,99,235,.18),transparent 60%),var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(160deg,#ffe27a 0%,#f5c518 45%,#d9a90b 100%);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 5px 0 #a37d05,0 10px 22px rgba(245,197,24,.28),inset 0 2px 0 rgba(255,255,255,.6);flex:none;text-shadow:0 1px 0 rgba(255,255,255,.5)}
.hi small{display:block;font-size:13px;color:var(--sub)}
.hi b{font-size:clamp(18px,5.4vw,21px);white-space:nowrap;font-weight:900;letter-spacing:-.3px}
header .sp{flex:1}
.date{font-size:13px;color:var(--sub);text-align:right;white-space:nowrap}
.search{display:flex;align-items:center;gap:8px;background:#0a1122;border:1px solid var(--line);border-radius:16px;padding:0 14px;height:48px;margin-bottom:18px;box-shadow:inset 0 3px 8px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.06)}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px}
.search input::placeholder{color:#7b86a3}
.sec{margin-bottom:22px}
.sech{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:12px}
.sech b{font-size:17px;font-weight:900;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.45)}
.sech span{font-size:12.5px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.app{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;text-align:center}
.ic{--d:color-mix(in srgb,var(--c) 55%,#000);position:relative;width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;
  background:var(--c);background-image:linear-gradient(165deg,rgba(255,255,255,.38) 0%,rgba(255,255,255,.08) 42%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.28) 100%);
  box-shadow:0 6px 0 var(--d),0 12px 20px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.18);
  transition:transform .09s ease-out,box-shadow .09s ease-out;margin-bottom:6px}
.ic::before{content:'';position:absolute;left:9%;right:9%;top:5%;height:42%;border-radius:16px 16px 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0));pointer-events:none}
.ic svg{position:relative;filter:drop-shadow(0 2px 0 rgba(0,0,0,.28))}
.app:active .ic,.app.press .ic{transform:translateY(6px);box-shadow:0 0 0 var(--d),0 3px 6px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.18)}
@media (hover:hover){.app:hover .ic{transform:translateY(-2px);box-shadow:0 8px 0 var(--d),0 16px 24px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 0 rgba(0,0,0,.18)}}
.app:focus-visible .ic{outline:3px solid var(--gold);outline-offset:3px}
.nm{font-size:12.5px;font-weight:700;line-height:1.25;color:#e5e7eb;word-break:keep-all}
.ds{display:none}
.badge{position:absolute;top:-4px;right:calc(50% - 40px);background:#374151;color:#e5e7eb;border:1px solid #4b5563;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;white-space:nowrap}
.app.soon .ic{filter:saturate(.25) brightness(.75)}
/* PC: 설명까지 보이는 카드 */
@media (min-width:900px){
  .wrap{padding-top:30px}
  .secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .app{flex-direction:row;align-items:center;text-align:left;gap:14px;background:linear-gradient(180deg,#1b2848,#141f3a);border:1px solid #2b3a66;border-radius:18px;padding:12px 14px 14px;box-shadow:0 5px 0 #0a1124,0 10px 18px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.08);transition:transform .09s,box-shadow .09s}
  .app:hover{border-color:#3d5190;background:linear-gradient(180deg,#203057,#17244a)}
  .app:active,.app.press{transform:translateY(5px);box-shadow:0 0 0 #0a1124,0 3px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
  .app:active .ic,.app.press .ic{transform:none}
  .ic{width:52px;height:52px;border-radius:16px;flex:none;margin-bottom:4px}
  .ic svg{width:25px;height:25px}
  .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nm{font-size:14.5px;font-weight:800}
  .ds{display:block;font-size:12px;color:var(--sub);line-height:1.35}
  .badge{position:static;margin-left:auto;align-self:center}
}
/* 아래에서 올라오는 창 */
.sheet{position:fixed;inset:0;background:rgba(3,7,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fd .15s}
.sheet .box{background:#111a33;border:1px solid var(--line);border-radius:22px 22px 0 0;width:min(520px,100%);padding:20px 18px max(22px,env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:900px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.5}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-weight:800}
.opt small{display:block;font-weight:500;color:var(--sub);font-size:12.5px}
.opt .ic{width:42px;height:42px;border-radius:13px;margin:0;box-shadow:0 3px 0 var(--d),inset 0 2px 0 rgba(255,255,255,.5)}.opt .ic::before{border-radius:10px 10px 40% 40%}
.opt{box-shadow:0 4px 0 #0a1124;transition:transform .08s,box-shadow .08s}.opt:active{transform:translateY(4px);box-shadow:none}
.dl{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,#ffe27a,#f5c518 50%,#e0b10f);color:#0c1428;border-radius:18px;padding:12px 14px;margin-bottom:18px;box-shadow:0 5px 0 #a37d05,0 10px 20px rgba(245,197,24,.2),inset 0 2px 0 rgba(255,255,255,.55);cursor:pointer;border:0;width:100%;font:inherit;text-align:left;transition:transform .08s,box-shadow .08s}
.dl:active{transform:translateY(5px);box-shadow:0 0 0 #a37d05,0 3px 8px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.5)}
.dl[hidden]{display:none}.search svg{flex:none}
.dl b{font-size:16px;font-weight:900;display:block}.dl small{font-size:12.5px;font-weight:700;opacity:.8}
.dl .x{margin-left:auto;background:rgba(12,20,40,.12);border-radius:10px;padding:6px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.close{all:unset;cursor:pointer;display:block;text-align:center;width:100%;padding:12px 0 2px;color:var(--sub);font-weight:700}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fd{from{opacity:0}}
#updbar{position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#1f2937;color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.foot{color:#6b7591;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">正</div>
    <div class="hi"><small>용인대 정도 태권도 2관</small><b>관장님, 안녕하세요</b></div>
    <div class="sp"></div>
    <div class="date" id="today"></div>
  </header>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7b86a3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="앱 찾기 (예: 수련비, 심사)" aria-label="앱 찾기">
  </label>
  <button class="dl" id="dl" hidden></button>
  <div class="secs" id="secs"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="apps.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IN_APP = !!window.AIO;   // 폰 올인원 앱 안에서 열렸는지
const svg = (k, s) => `<svg width="${s||30}" height="${s||30}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${JD_ICONS[k] || JD_ICONS.att}"/></svg>`;
{ const d = new Date(); $('#today').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일<br>${'일월화수목금토'[d.getDay()]}요일`; }
$('#foot').textContent = IN_APP ? '폰 올인원 앱 ' + (AIO.version ? 'v' + AIO.version() : '') : 'PC · 웹 올인원 — 폰에서는 올인원 앱을 설치해 쓰세요';

function render(){
  const q = $('#q').value.trim();
  const list = JD_APPS.filter(a => !q || a.name.includes(q) || (a.desc || '').includes(q));
  $('#secs').innerHTML = JD_SECTIONS.map(s => {
    const apps = list.filter(a => a.sec === s.id); if (!apps.length) return '';
    return `<section class="sec"><div class="sech"><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></div><div class="grid">${apps.map(a => {
      const i = JD_APPS.indexOf(a);
      return `<button class="app${a.soon ? ' soon' : ''}" data-i="${i}" aria-label="${esc(a.name)}"><div class="ic" style="--c:${a.bg}">${svg(a.icon)}</div><div class="tx"><div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.desc || '')}</div></div>${a.soon ? '<span class="badge">준비 중</span>' : ''}</button>`;
    }).join('')}</div></section>`;
  }).join('') || '<p style="color:var(--sub)">찾는 앱이 없어요</p>';
  document.querySelectorAll('.app').forEach(b => b.onclick = () => openApp(JD_APPS[+b.dataset.i]));
}
$('#q').addEventListener('input', render);
render();

function sheet(html){ const d = document.createElement('div'); d.className = 'sheet'; d.innerHTML = `<div class="box">${html}<button class="close">닫기</button></div>`; d.onclick = e => { if (e.target === d || e.target.classList.contains('close')) d.remove(); }; document.body.appendChild(d); return d; }
// 올인원에서 연 앱이라는 표시(aio=1 / 폰 앱은 aio=app)를 붙여서, 그 앱에서 뒤로가기하면 '메인 메뉴로 갈까요?'를 물어봐요
function tagUrl(url){ if (!/^https:\/\/yujongho0714\.github\.io\//.test(url)) return url; const i = url.indexOf('#'), base = i < 0 ? url : url.slice(0, i), hash = i < 0 ? '' : url.slice(i);
  return base + (base.includes('?') ? '&' : '?') + 'aio=' + (IN_APP ? 'app' : '1') + hash; }
function go(url){ url = tagUrl(url); if (IN_APP) AIO.open(url); else location.href = url; }
// 홈에서 뒤로가기 = '종료할까요?' (확인을 눌러야만 나가요)
(function(){
  try { history.pushState({ home: 1 }, '', location.href); } catch(e){}
  let asking = false;
  addEventListener('popstate', e => {
    if (e.state && e.state.home) return;
    try { history.pushState({ home: 1 }, '', location.href); } catch(err){}
    if (asking) return; asking = true;
    const d = sheet(`<h3>정도 올인원을 종료할까요?</h3><p>확인을 누르면 닫혀요.</p><button class="opt" id="exitYes" style="justify-content:center;background:#f5c518;color:#0c1428;border-color:#f5c518">종료</button>`);
    const done = () => { asking = false; };
    d.querySelector('.close').textContent = '취소'; d.addEventListener('click', ev => { if (ev.target === d || ev.target.classList.contains('close')) done(); });
    d.querySelector('#exitYes').onclick = () => { done(); d.remove();
      if (IN_APP && AIO.exit){ AIO.exit(); return; }
      window.close();
      setTimeout(() => { document.body.innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:'Noto Sans KR',sans-serif;color:#f3f4f6"><div style="width:64px;height:64px;border-radius:18px;background:#f5c518;color:#0c1428;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px">正</div><b style="font-size:22px">정도 올인원을 닫았어요</b><span style="color:#9ca3af">이 탭은 닫아도 돼요</span><a href="${location.pathname}" style="background:#f5c518;color:#0c1428;font-weight:900;padding:12px 22px;border-radius:14px;text-decoration:none">다시 열기</a></div>`; }, 200);
    };
  });
})();
function openApp(a){
  if (a.soon){ sheet(`<h3>${esc(a.name)}</h3><p>곧 만들어요. 다 되면 여기서 바로 열려요.<br><small>${esc(a.desc || '')}</small></p>`); return; }
  if (IN_APP && a.pkg && a.url){
    const d = sheet(`<h3>${esc(a.name)}</h3><p>어떻게 열까요?</p>
      <button class="opt" id="o1"><div class="ic" style="--c:${a.bg}">${svg(a.icon, 22)}</div><div>폰 앱 열기<small>키오스크 · 문자 폰용 앱</small></div></button>
      <button class="opt" id="o2"><div class="ic" style="--c:#334155">${svg('ppl', 22)}</div><div>관리 화면 열기<small>PC와 같은 관리 화면</small></div></button>`);
    d.querySelector('#o1').onclick = () => { d.remove(); AIO.launch(a.pkg, a.install || ''); };
    d.querySelector('#o2').onclick = () => { d.remove(); go(a.url); };
    return;
  }
  if (a.pkg && !a.url){
    if (IN_APP){ AIO.launch(a.pkg, a.install || ''); return; }
    sheet(`<h3>${esc(a.name)}</h3><p>폰에서 쓰는 앱이에요. 폰의 올인원 앱에서 열어 주세요.</p>${a.install ? `<a class="opt" href="${esc(a.install)}" target="_blank" rel="noopener"><div class="ic" style="--c:${a.bg}">${svg(a.icon, 22)}</div><div>앱 받기 (APK)<small>깃허브에서 내려받기</small></div></a>` : ''}`);
    return;
  }
  go(a.url);
}

// 누를 때 손맛: 살짝 눌리는 모양 + 진동
document.addEventListener('pointerdown', e => { const b = e.target.closest('.app,.opt,.dl'); if (!b) return; b.classList.add('press'); try { navigator.vibrate && navigator.vibrate(12); } catch(_){} });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, () => document.querySelectorAll('.press').forEach(x => x.classList.remove('press')), true));
// 앱으로 받기 (폰: 올인원 APK / PC: 바탕화면 앱 설치)
const APK = 'https://github.com/yujongho0714/allinone/releases/latest/download/jungdo-allinone.apk';
const isAndroid = /Android/i.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches;
let pwaPrompt = null;
function dlBar(){
  const d = $('#dl'); if (IN_APP || standalone){ d.hidden = true; return; }
  let off = false; try { off = localStorage.getItem('aio_dl_off') === '1'; } catch(_){}
  if (off){ d.hidden = true; return; }
  if (!isAndroid && !pwaPrompt){ d.hidden = true; return; }
  d.hidden = false;
  d.innerHTML = `<div class="ic" style="--c:#0c1428;width:44px;height:44px;border-radius:13px;margin:0">${svg(isAndroid ? 'down' : 'pc', 24)}</div><div><b>${isAndroid ? '폰에 올인원 앱 받기' : 'PC에 올인원 설치하기'}</b><small>${isAndroid ? '눌러서 설치하면 아이콘 하나로 바로 열려요' : '바탕화면 아이콘으로 바로 열려요'}</small></div><span class="x" id="dlx">닫기</span>`;
}
$('#dl').onclick = e => {
  if (e.target.id === 'dlx'){ try { localStorage.setItem('aio_dl_off', '1'); } catch(_){} dlBar(); return; }
  if (!isAndroid && pwaPrompt){ pwaPrompt.prompt(); pwaPrompt.userChoice.finally(() => { pwaPrompt = null; dlBar(); }); return; }
  sheet(`<h3>폰에 올인원 앱 받기</h3><p>① 아래 [앱 받기]를 눌러 내려받아요<br>② 다 받으면 알림이나 ‘내 파일 → 다운로드’에서 <b>jungdo-allinone.apk</b>를 눌러요<br>③ “출처를 알 수 없는 앱” 안내가 나오면 <b>설정 → 이 출처 허용</b>을 켜고 [설치]<br>④ 삼성 폰에서 막히면: 설정 → 보안 및 개인정보 보호 → <b>자동 차단</b> 끄기</p>
    <a class="opt" href="${APK}" style="justify-content:center;background:#f5c518;color:#0c1428;border-color:#f5c518">⬇️ 앱 받기 (APK)</a>
    <p style="margin-top:6px;font-size:12.5px">한 번 설치하면 새 버전은 앱이 알아서 받아요.</p>`);
};
if ('serviceWorker' in navigator && !IN_APP) navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); pwaPrompt = e; dlBar(); });
dlBar();
// 폰 앱: 새 버전 받는 중 표시
window.onUpdateProgress = p => {
  let b = document.getElementById('updbar');
  if (!b){ b = document.createElement('div'); b.id = 'updbar'; document.body.appendChild(b); }
  if (p < 0){ b.remove(); return; }
  b.innerHTML = p >= 100 ? '✅ 다 받았어요 — 설치 화면에서 [업데이트]를 누르세요' : `⬇️ 새 버전 받는 중… ${p}%<div style="height:6px;background:#374151;border-radius:3px;margin-top:8px"><div style="height:6px;width:${p}%;background:#f5c518;border-radius:3px"></div></div>`;
  if (p >= 100) setTimeout(() => b.remove(), 8000);
};
</script>
</body>
</html>
