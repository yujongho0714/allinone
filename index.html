<style>
/* 밝은 업무형 홈: 흰 바탕 · 남색 글씨 · 원장님 아이콘 그림 */
:root{--bg:#ffffff;--card:#ffffff;--line:#e6e8ee;--ink:#14213d;--sub:#6b7280;--gold:#b8860b;--navy:#14213d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
body{min-height:100vh;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.logo{width:54px;height:54px;flex:none;background:url(ui/aio/logo_mark.webp) center/contain no-repeat;font-size:0}
.hi small{display:block;font-size:13px;color:var(--sub);font-weight:700}
.hi b{font-size:clamp(18px,5.4vw,22px);white-space:nowrap;font-weight:900;letter-spacing:-.3px;color:var(--navy)}
header .sp{flex:1}
.date{font-size:13px;color:var(--sub);text-align:right;white-space:nowrap;font-weight:700}
.hero{position:relative;height:92px;margin:0 0 14px;border-radius:14px;overflow:hidden;background:#14213d url(ui/aio/aio_bg_kiosk.webp) right center/auto 100% no-repeat;box-shadow:0 2px 0 #0b1328,0 8px 18px rgba(20,33,61,.18);display:flex;align-items:center;padding:0 18px}
.hero b{color:#f3d27a;font-size:17px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4)}.hero small{display:block;color:#d9dfef;font-size:12.5px;font-weight:500;margin-top:3px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:0 14px;height:46px;margin-bottom:16px;box-shadow:none;background:#f5f6f8;border-color:#f5f6f8}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px}
.search input::placeholder{color:#9ca3af}
.sec{margin-bottom:20px}
.sech{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.sech b{font-size:16.5px;font-weight:900;color:var(--navy)}
.sech span{font-size:12.5px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.app{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.ic{position:relative;width:66px;height:66px;display:flex;align-items:center;justify-content:center;transition:transform .09s ease-out;margin-bottom:2px}
.ic img{width:100%;height:100%;object-fit:contain}
.ic svg{width:34px;height:34px;padding:14px;box-sizing:content-box;background:var(--c);border-radius:16px;stroke:#fff}
.app:active .ic,.app.press .ic{transform:translateY(3px) scale(.97)}
@media (hover:hover){.app:hover .ic{transform:translateY(-2px)}}
.app:focus-visible .ic{outline:3px solid var(--gold);outline-offset:3px;border-radius:14px}
.nm{font-size:12.5px;font-weight:800;line-height:1.25;color:var(--navy);word-break:keep-all}
.ds{display:none}
.badge{position:absolute;top:-4px;right:calc(50% - 40px);background:#f3f4f6;color:#6b7280;border:1px solid var(--line);font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;white-space:nowrap}
.app.soon .ic{filter:grayscale(.8) opacity(.7)}
/* PC: 설명까지 보이는 카드 */
@media (min-width:900px){
  .wrap{padding-top:26px}
  .hero{height:110px}
  .secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .app{flex-direction:row;align-items:center;text-align:left;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;box-shadow:none;transition:transform .09s,box-shadow .09s,border-color .09s}
  .app:hover{border-color:#cfd4de;box-shadow:0 4px 12px rgba(20,33,61,.06)}
  .app:active,.app.press{transform:translateY(1px)}
  .app:active .ic,.app.press .ic{transform:none}
  .ic{width:54px;height:54px;flex:none;margin:0}
  .ic svg{width:24px;height:24px;padding:12px}
  .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nm{font-size:14.5px}
  .ds{display:block;font-size:12px;color:var(--sub);line-height:1.35}
  .badge{position:static;margin-left:auto;align-self:center}
}
/* 아래에서 올라오는 창 */
.sheet{position:fixed;inset:0;background:rgba(20,33,61,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fd .15s}
.sheet .box{background:var(--card);border:1px solid var(--line);border-radius:18px 18px 0 0;width:min(520px,100%);padding:20px 18px max(22px,env(safe-area-inset-bottom));animation:up .2s ease-out;color:var(--ink)}
@media (min-width:900px){.sheet{align-items:center}.sheet .box{border-radius:18px}}
.sheet h3{margin:0 0 4px;font-size:19px;color:var(--navy)}.sheet p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.5}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-weight:800;color:var(--navy);box-shadow:none;transition:transform .08s}
.opt small{display:block;font-weight:500;color:var(--sub);font-size:12.5px}
.opt .ic{width:42px;height:42px;margin:0}.opt .ic svg{width:20px;height:20px;padding:11px;border-radius:12px}
.opt:active{transform:translateY(2px);box-shadow:none}
.dl{display:flex;align-items:center;gap:12px;background:var(--navy);color:#f3d27a;border-radius:12px;padding:12px 14px;margin-bottom:16px;box-shadow:0 3px 0 #0b1328;cursor:pointer;border:0;width:100%;font:inherit;text-align:left}
.dl:active{transform:translateY(3px);box-shadow:none}
.dl[hidden]{display:none}.search svg{flex:none}
.dl b{font-size:16px;font-weight:900;display:block}.dl small{font-size:12.5px;font-weight:700;opacity:.85;color:#d9dfef}
.dl .ic svg{background:transparent!important;padding:6px}
.dl .x{margin-left:auto;background:rgba(243,210,122,.15);border-radius:10px;padding:6px 10px;font-weight:900;font-size:13px;white-space:nowrap}
.close{all:unset;cursor:pointer;display:block;text-align:center;width:100%;padding:12px 0 2px;color:var(--sub);font-weight:700}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fd{from{opacity:0}}
#updbar{position:fixed;left:12px;right:12px;top:12px;z-index:99;background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.foot{color:#9ca3af;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">正</div>
    <div class="hi"><small>용인대 정도 태권도 2관</small><b>관장님, 안녕하세요</b></div>
    <div class="sp"></div>
    <div class="date" id="today"></div>
  </header>
  <div class="hero"><div><b>오늘도 힘찬 하루 보내세요</b><small>앱을 누르면 바로 열려요 · 위에서 찾기도 돼요</small></div></div>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="앱 찾기 (예: 수련비, 심사)" aria-label="앱 찾기">
  </label>
  <button class="dl" id="dl" hidden></button>
  <div class="secs" id="secs"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="apps.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IN_APP = !!window.AIO;   // 폰 올인원 앱 안에서 열렸는지
const AIO_IMG = new Set(['att','sms','ppl','phone','bus','pin','walk','won','unpaid','exam','medal','belt','cam','cal','heart','book','rope','coach','cup','target','ball','word','edu','down','pc','video']);
const svg = (k, s) => AIO_IMG.has(k) ? `<img src="ui/aio2/aio_${k}.webp" alt="" width="${s||30}" height="${s||30}">` : `<svg width="${s||30}" height="${s||30}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${JD_ICONS[k] || JD_ICONS.att}"/></svg>`;
{ const d = new Date(); $('#today').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일<br>${'일월화수목금토'[d.getDay()]}요일`; }
$('#foot').textContent = IN_APP ? '폰 올인원 앱 ' + (AIO.version ? 'v' + AIO.version() : '') : 'PC · 웹 올인원 — 폰에서는 올인원 앱을 설치해 쓰세요';

function render(){
  const q = $('#q').value.trim();
  const list = JD_APPS.filter(a => !q || a.name.includes(q) || (a.desc || '').includes(q));
  $('#secs').innerHTML = JD_SECTIONS.map(s => {
    const apps = list.filter(a => a.sec === s.id); if (!apps.length) return '';
    return `<section class="sec"><div class="sech"><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></div><div class="grid">${apps.map(a => {
      const i = JD_APPS.indexOf(a);
      return `<button class="app${a.soon ? ' soon' : ''}" data-i="${i}" aria-label="${esc(a.name)}"><div class="ic" style="--c:${a.bg}">${svg(a.icon)}</div><div class="tx"><div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.desc || '')}</div></div>${a.soon ? '<span class="badge">준비 중</span>' : ''}</button>`;
    }).join('')}</div></section>`;
  }).join('') || '<p style="color:var(--sub)">찾는 앱이 없어요</p>';
  document.querySelectorAll('.app').forEach(b => b.onclick = () => openApp(JD_APPS[+b.dataset.i]));
}
$('#q').addEventListener('input', render);
render();

function sheet(html){ const d = document.createElement('div'); d.className = 'sheet'; d.innerHTML = `<div class="box">${html}<button class="close">닫기</button></div>`; d.onclick = e => { if (e.target === d || e.target.classList.contains('close')) d.remove(); }; document.body.appendChild(d); return d; }
// 올인원에서 연 앱이라는 표시(aio=1 / 폰 앱은 aio=app)를 붙여서, 그 앱에서 뒤로가기하면 '메인 메뉴로 갈까요?'를 물어봐요
function tagUrl(url){ if (!/^https:\/\/yujongho0714\.github\.io\//.test(url)) return url; const i = url.indexOf('#'), base = i < 0 ? url : url.slice(0, i), hash = i < 0 ? '' : url.slice(i);
  return base + (base.includes('?') ? '&' : '?') + 'aio=' + (IN_APP ? 'app' : '1') + hash; }
function go(url){ url = tagUrl(url); if (IN_APP) AIO.open(url); else { leaveOK = true; location.href = url; } }
// 홈에서 뒤로가기 = '종료할까요?' — [종료]를 누르기 전에는 절대 안 나가요
//  · 폰 올인원 앱: 앱이 뒤로가기를 직접 받아서 jdBack()을 불러요 (앱이 닫히지 않음)
//  · 브라우저: 가짜 기록을 여러 겹 쌓고(누를 때마다 다시 채움) + 나가려 하면 브라우저 확인창
let leaveOK = false, asking = false;
function exitSheet(){
  if (asking) return true; asking = true;
  const d = sheet(`<h3>정도 올인원을 종료할까요?</h3><p>[종료]를 눌러야 닫혀요.</p><button class="opt" id="exitYes" style="justify-content:center;background:#f5c518;color:#0c1428;border-color:#f5c518">종료</button>`);
  const done = () => { asking = false; };
  d.querySelector('.close').textContent = '취소';
  d.addEventListener('click', ev => { if (ev.target === d || ev.target.classList.contains('close')) done(); });
  d.querySelector('#exitYes').onclick = () => { done(); d.remove(); leaveOK = true;
    if (IN_APP && AIO.exit){ AIO.exit(); return; }
    window.close();                                   // PC에 설치한 앱 창이면 여기서 닫혀요
    // 크롬 탭은 사이트가 스스로 닫을 수 없어서, 올인원에 들어오기 전 화면으로 바로 돌아가요 (뒤로가기 여러 번 한 것과 같아요)
    const steps = ((history.state && history.state.home) || 0) + 1;
    setTimeout(() => { if (!document.hidden) history.go(-steps); }, 60);
    setTimeout(() => { if (document.hidden) return; document.body.innerHTML = `<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center;font-family:'Noto Sans KR',sans-serif;color:#f3f4f6"><div style="width:64px;height:64px;border-radius:18px;background:#f5c518;color:#0c1428;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px">正</div><b style="font-size:22px">정도 올인원을 닫았어요</b><span style="color:#9ca3af;line-height:1.6">크롬에서 바로 열면 탭은 직접 닫아야 해요 (탭 버튼 → ✕)<br>폰 올인원 앱으로 쓰면 [종료]를 누르는 순간 앱이 닫혀요</span><a href="${location.pathname}" style="background:#f5c518;color:#0c1428;font-weight:900;padding:12px 22px;border-radius:14px;text-decoration:none">다시 열기</a></div>`; }, 900);
  };
  return true;
}
window.jdBack = () => {
  if (document.querySelector('.sheet') && !asking){ document.querySelector('.sheet').remove(); return true; } // 열린 창이 있으면 그 창만 닫기
  return exitSheet();
};
if (!IN_APP){
  const DEPTH = 4;
  const fill = () => { let n = 0; while (n < DEPTH){ const st = history.state; if (st && st.home >= DEPTH) break; try { history.pushState({ home: ((st && st.home) || 0) + 1 }, '', location.href); } catch(e){ break; } n++; } };
  fill();
  ['pointerdown', 'keydown', 'touchstart'].forEach(t => addEventListener(t, fill, { capture: true, passive: true }));
  addEventListener('popstate', () => { exitSheet(); });
  addEventListener('beforeunload', e => { if (leaveOK) return; e.preventDefault(); e.returnValue = ''; });
}
function openApp(a){
  if (a.soon){ sheet(`<h3>${esc(a.name)}</h3><p>곧 만들어요. 다 되면 여기서 바로 열려요.<br><small>${esc(a.desc || '')}</small></p>`); return; }
  if (IN_APP && a.pkg && a.url){
    const d = sheet(`<h3>${esc(a.name)}</h3><p>어떻게 열까요?</p>
      <button class="opt" id="o1"><div class="ic" style="--c:${a.bg}">${svg(a.icon, 22)}</div><div>폰 앱 열기<small>키오스크 · 문자 폰용 앱</small></div></button>
      <button class="opt" id="o2"><div class="ic" style="--c:#334155">${svg('ppl', 22)}</div><div>관리 화면 열기<small>PC와 같은 관리 화면</small></div></button>`);
    d.querySelector('#o1').onclick = () => { d.remove(); AIO.launch(a.pkg, a.install || ''); };
    d.querySelector('#o2').onclick = () => { d.remove(); go(a.url); };
    return;
  }
  if (a.pkg && !a.url){
    if (IN_APP){ AIO.launch(a.pkg, a.install || ''); return; }
    sheet(`<h3>${esc(a.name)}</h3><p>폰에서 쓰는 앱이에요. 폰의 올인원 앱에서 열어 주세요.</p>${a.install ? `<a class="opt" href="${esc(a.install)}" target="_blank" rel="noopener"><div class="ic" style="--c:${a.bg}">${svg(a.icon, 22)}</div><div>앱 받기 (APK)<small>깃허브에서 내려받기</small></div></a>` : ''}`);
    return;
  }
  go(a.url);
}

// 누를 때 손맛: 살짝 눌리는 모양 + 진동
document.addEventListener('pointerdown', e => { const b = e.target.closest('.app,.opt,.dl'); if (!b) return; b.classList.add('press'); try { navigator.vibrate && navigator.vibrate(12); } catch(_){} });
['pointerup', 'pointercancel', 'pointerleave'].forEach(t => document.addEventListener(t, () => document.querySelectorAll('.press').forEach(x => x.classList.remove('press')), true));
// 앱으로 받기 (폰: 올인원 APK / PC: 바탕화면 앱 설치)
const APK = 'https://github.com/yujongho0714/allinone/releases/latest/download/jungdo-allinone.apk';
const isAndroid = /Android/i.test(navigator.userAgent), standalone = matchMedia('(display-mode: standalone)').matches;
let pwaPrompt = null;
function dlBar(){
  const d = $('#dl'); if (IN_APP || standalone){ d.hidden = true; return; }
  let off = false; try { off = localStorage.getItem('aio_dl_off') === '1'; } catch(_){}
  if (off){ d.hidden = true; return; }
  if (!isAndroid && !pwaPrompt){ d.hidden = true; return; }
  d.hidden = false;
  d.innerHTML = `<div class="ic" style="--c:#0c1428;width:44px;height:44px;border-radius:13px;margin:0">${svg(isAndroid ? 'down' : 'pc', 24)}</div><div><b>${isAndroid ? '폰에 올인원 앱 받기' : 'PC에 올인원 설치하기'}</b><small>${isAndroid ? '눌러서 설치하면 아이콘 하나로 바로 열려요' : '바탕화면 아이콘으로 바로 열려요'}</small></div><span class="x" id="dlx">닫기</span>`;
}
$('#dl').onclick = e => {
  if (e.target.id === 'dlx'){ try { localStorage.setItem('aio_dl_off', '1'); } catch(_){} dlBar(); return; }
  if (!isAndroid && pwaPrompt){ pwaPrompt.prompt(); pwaPrompt.userChoice.finally(() => { pwaPrompt = null; dlBar(); }); return; }
  sheet(`<h3>폰에 올인원 앱 받기</h3><p>① 아래 [앱 받기]를 눌러 내려받아요<br>② 다 받으면 알림이나 ‘내 파일 → 다운로드’에서 <b>jungdo-allinone.apk</b>를 눌러요<br>③ “출처를 알 수 없는 앱” 안내가 나오면 <b>설정 → 이 출처 허용</b>을 켜고 [설치]<br>④ 삼성 폰에서 막히면: 설정 → 보안 및 개인정보 보호 → <b>자동 차단</b> 끄기</p>
    <a class="opt" href="${APK}" style="justify-content:center;background:#f5c518;color:#0c1428;border-color:#f5c518">⬇️ 앱 받기 (APK)</a>
    <p style="margin-top:6px;font-size:12.5px">한 번 설치하면 새 버전은 앱이 알아서 받아요.</p>`);
};
if ('serviceWorker' in navigator && !IN_APP) navigator.serviceWorker.register('sw.js').catch(() => {});
addEventListener('beforeinstallprompt', e => { e.preventDefault(); pwaPrompt = e; dlBar(); });
dlBar();
// 폰 앱: 새 버전 받는 중 표시
window.onUpdateProgress = p => {
  let b = document.getElementById('updbar');
  if (!b){ b = document.createElement('div'); b.id = 'updbar'; document.body.appendChild(b); }
  if (p < 0){ b.remove(); return; }
  b.innerHTML = p >= 100 ? '✅ 다 받았어요 — 설치 화면에서 [업데이트]를 누르세요' : `⬇️ 새 버전 받는 중… ${p}%<div style="height:6px;background:#374151;border-radius:3px;margin-top:8px"><div style="height:6px;width:${p}%;background:#f5c518;border-radius:3px"></div></div>`;
  if (p >= 100) setTimeout(() => b.remove(), 8000);
};
</script>
