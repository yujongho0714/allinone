<title>정도 올인원</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c1428;--card:#16213d;--line:#24315a;--ink:#f3f4f6;--sub:#9ca3af;--gold:#f5c518}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 500px at 85% -10%,rgba(245,197,24,.10),transparent 60%),
  radial-gradient(900px 500px at -10% 110%,rgba(37,99,235,.18),transparent 60%),var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 16px 40px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.logo{width:48px;height:48px;border-radius:15px;background:var(--gold);color:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:21px;box-shadow:0 6px 18px rgba(245,197,24,.25);flex:none}
.hi small{display:block;font-size:13px;color:var(--sub)}
.hi b{font-size:21px;font-weight:900;letter-spacing:-.3px}
header .sp{flex:1}
.date{font-size:13px;color:var(--sub);text-align:right}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 14px;height:46px;margin-bottom:18px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:15px}
.search input::placeholder{color:#7b86a3}
.sec{margin-bottom:22px}
.sech{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:7px;margin-bottom:12px}
.sech b{font-size:17px;font-weight:900;color:var(--gold)}
.sech span{font-size:12.5px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px 6px}
.app{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;text-align:center}
.ic{width:62px;height:62px;border-radius:19px;display:flex;align-items:center;justify-content:center;box-shadow:0 7px 16px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.18);transition:transform .12s}
.app:active .ic{transform:scale(.9)}
.app:focus-visible .ic{outline:3px solid var(--gold);outline-offset:3px}
.nm{font-size:12.5px;font-weight:700;line-height:1.25;color:#e5e7eb;word-break:keep-all}
.ds{display:none}
.badge{position:absolute;top:-4px;right:calc(50% - 40px);background:#374151;color:#e5e7eb;border:1px solid #4b5563;font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:99px;white-space:nowrap}
.app.soon .ic{filter:saturate(.25) brightness(.75)}
/* PC: 설명까지 보이는 카드 */
@media (min-width:900px){
  .wrap{padding-top:30px}
  .secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 26px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .app{flex-direction:row;align-items:center;text-align:left;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .app:hover{border-color:#3a4a7a;background:#1a2747}
  .ic{width:50px;height:50px;border-radius:15px;flex:none}
  .ic svg{width:25px;height:25px}
  .tx{display:flex;flex-direction:column;gap:2px;min-width:0}
  .nm{font-size:14.5px;font-weight:800}
  .ds{display:block;font-size:12px;color:var(--sub);line-height:1.35}
  .badge{position:static;margin-left:auto;align-self:center}
}
/* 아래에서 올라오는 창 */
.sheet{position:fixed;inset:0;background:rgba(3,7,18,.6);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fd .15s}
.sheet .box{background:#111a33;border:1px solid var(--line);border-radius:22px 22px 0 0;width:min(520px,100%);padding:20px 18px max(22px,env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:900px){.sheet{align-items:center}.sheet .box{border-radius:22px}}
.sheet h3{margin:0 0 4px;font-size:19px}.sheet p{margin:0 0 14px;color:var(--sub);font-size:14px;line-height:1.5}
.opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;font-weight:800}
.opt small{display:block;font-weight:500;color:var(--sub);font-size:12.5px}
.opt .ic{width:42px;height:42px;border-radius:12px;box-shadow:none}
.close{all:unset;cursor:pointer;display:block;text-align:center;width:100%;padding:12px 0 2px;color:var(--sub);font-weight:700}
@keyframes up{from{transform:translateY(30px);opacity:.4}}@keyframes fd{from{opacity:0}}
#updbar{position:fixed;left:12px;right:12px;top:12px;z-index:99;background:#1f2937;color:#fff;border-radius:12px;padding:12px 14px;font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.foot{color:#6b7591;font-size:12px;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">正</div>
    <div class="hi"><small>용인대 정도 태권도 2관</small><b>관장님, 안녕하세요</b></div>
    <div class="sp"></div>
    <div class="date" id="today"></div>
  </header>
  <label class="search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7b86a3" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="앱 찾기 (예: 수련비, 심사)" aria-label="앱 찾기">
  </label>
  <div class="secs" id="secs"></div>
  <div class="foot" id="foot"></div>
</div>
<script src="apps.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IN_APP = !!window.AIO;   // 폰 올인원 앱 안에서 열렸는지
const svg = (k, s) => `<svg width="${s||30}" height="${s||30}" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${JD_ICONS[k] || JD_ICONS.att}"/></svg>`;
{ const d = new Date(); $('#today').innerHTML = `${d.getMonth()+1}월 ${d.getDate()}일<br>${'일월화수목금토'[d.getDay()]}요일`; }
$('#foot').textContent = IN_APP ? '폰 올인원 앱 ' + (AIO.version ? 'v' + AIO.version() : '') : 'PC · 웹 올인원 — 폰에서는 올인원 앱을 설치해 쓰세요';

function render(){
  const q = $('#q').value.trim();
  const list = JD_APPS.filter(a => !q || a.name.includes(q) || (a.desc || '').includes(q));
  $('#secs').innerHTML = JD_SECTIONS.map(s => {
    const apps = list.filter(a => a.sec === s.id); if (!apps.length) return '';
    return `<section class="sec"><div class="sech"><b>${esc(s.title)}</b><span>${esc(s.desc)}</span></div><div class="grid">${apps.map(a => {
      const i = JD_APPS.indexOf(a);
      return `<button class="app${a.soon ? ' soon' : ''}" data-i="${i}" aria-label="${esc(a.name)}"><div class="ic" style="background:${a.bg}">${svg(a.icon)}</div><div class="tx"><div class="nm">${esc(a.name)}</div><div class="ds">${esc(a.desc || '')}</div></div>${a.soon ? '<span class="badge">준비 중</span>' : ''}</button>`;
    }).join('')}</div></section>`;
  }).join('') || '<p style="color:var(--sub)">찾는 앱이 없어요</p>';
  document.querySelectorAll('.app').forEach(b => b.onclick = () => openApp(JD_APPS[+b.dataset.i]));
}
$('#q').addEventListener('input', render);
render();

function sheet(html){ const d = document.createElement('div'); d.className = 'sheet'; d.innerHTML = `<div class="box">${html}<button class="close">닫기</button></div>`; d.onclick = e => { if (e.target === d || e.target.classList.contains('close')) d.remove(); }; document.body.appendChild(d); return d; }
function go(url){ if (IN_APP) AIO.open(url); else window.open(url, '_blank', 'noopener'); }
function openApp(a){
  if (a.soon){ sheet(`<h3>${esc(a.name)}</h3><p>곧 만들어요. 다 되면 여기서 바로 열려요.<br><small>${esc(a.desc || '')}</small></p>`); return; }
  if (IN_APP && a.pkg && a.url){
    const d = sheet(`<h3>${esc(a.name)}</h3><p>어떻게 열까요?</p>
      <button class="opt" id="o1"><div class="ic" style="background:${a.bg}">${svg(a.icon, 22)}</div><div>폰 앱 열기<small>키오스크 · 문자 폰용 앱</small></div></button>
      <button class="opt" id="o2"><div class="ic" style="background:#334155">${svg('ppl', 22)}</div><div>관리 화면 열기<small>PC와 같은 관리 화면</small></div></button>`);
    d.querySelector('#o1').onclick = () => { d.remove(); AIO.launch(a.pkg, a.install || ''); };
    d.querySelector('#o2').onclick = () => { d.remove(); go(a.url); };
    return;
  }
  if (a.pkg && !a.url){
    if (IN_APP){ AIO.launch(a.pkg, a.install || ''); return; }
    sheet(`<h3>${esc(a.name)}</h3><p>폰에서 쓰는 앱이에요. 폰의 올인원 앱에서 열어 주세요.</p>${a.install ? `<a class="opt" href="${esc(a.install)}" target="_blank" rel="noopener"><div class="ic" style="background:${a.bg}">${svg(a.icon, 22)}</div><div>앱 받기 (APK)<small>깃허브에서 내려받기</small></div></a>` : ''}`);
    return;
  }
  go(a.url);
}

// 폰 앱: 새 버전 받는 중 표시
window.onUpdateProgress = p => {
  let b = document.getElementById('updbar');
  if (!b){ b = document.createElement('div'); b.id = 'updbar'; document.body.appendChild(b); }
  if (p < 0){ b.remove(); return; }
  b.innerHTML = p >= 100 ? '✅ 다 받았어요 — 설치 화면에서 [업데이트]를 누르세요' : `⬇️ 새 버전 받는 중… ${p}%<div style="height:6px;background:#374151;border-radius:3px;margin-top:8px"><div style="height:6px;width:${p}%;background:#f5c518;border-radius:3px"></div></div>`;
  if (p >= 100) setTimeout(() => b.remove(), 8000);
};
</script>
</body>
</html>
